<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Planner de Ofícios · Instituto ACQUA</title>
    <meta name="theme-color" content="#0f7c72" />
    <script>
      // Aplica o tema antes de desenhar a página (evita piscar claro→escuro). Espelho de src/utils/tema.ts.
      (function () {
        var escolha = null;
        try { escolha = localStorage.getItem("planner-tema"); } catch (e) {}
        var escuro = escolha === "escuro" || (escolha !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = escuro ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
